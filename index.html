<!DOCTYPE html>
<html>
<head>
    <title>我的附属站点</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text x='50' y='.9em' font-size='90' text-anchor='middle' fill='white'>E</text></svg>">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: 微软雅黑, sans-serif;
            margin: 0;
            padding: 50px;
            text-align: center;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ddd;
            max-width: 600px;
            margin: 0 auto 20px;
        }
        h1 {
            color: #333;
            font-size: 28px;
        }
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }
        textarea {
            width: 500px;
            height: 300px;
            font-size: 18px;
        }
        a {
            font-size: 18px;
            margin: 0 8px;
            color: #1677ff;
        }
        .download-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #1677ff;
            color: #fff;
            text-decoration: none;
            font-size: 17px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background-color: #0958d9;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>网站</h1>
        <a href="https://github.com/Eason-su725/Eason-su725.github.io">github</a>
    </div>

    <!-- 和主站尺寸完全一致文本框 -->
    <div class="box">
        <textarea placeholder="你在这里可以打字"></textarea>
    </div>

    <!-- 重点：去掉 target="_blank"，当前页面直接跳转回主站，不新开标签 -->
    <div class="box">
        <a href="https://eason-su725.github.io" class="download-btn">返回主站点</a>
    </div>
</body>
</html>
